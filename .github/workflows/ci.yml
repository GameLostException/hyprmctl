name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Run ruff
        run: ruff check src/ tests/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # Install GObject/GTK4 bindings into the system Python.
      # These packages are only available via apt — pip has no equivalent.
      # We do NOT use actions/setup-python here because its virtualenv Python
      # cannot see system site-packages where python3-gi is installed.
      - name: Install system dependencies (GTK4 + GI bindings)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            python3-pytest \
            python3-pytest-cov \
            gir1.2-gtk-4.0 \
            libgtk-4-dev \
            gir1.2-gdkpixbuf-2.0

      - name: Install Python dev dependencies (into system Python)
        run: python3 -m pip install --break-system-packages -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          GDK_BACKEND: offscreen
          DISPLAY: ""
        run: |
          python3 -m pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
